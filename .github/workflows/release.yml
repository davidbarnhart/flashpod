name: release

# On a `v*` tag this builds the standalone binaries (attached to a GitHub
# Release) AND publishes the pure-Python package to PyPI via Trusted Publishing.
# Tag a release (e.g. `git tag v0.1.6 && git push --tags`) to ship both, or run
# manually from the Actions tab to produce downloadable binaries for testing
# (the PyPI publish is tag-only).
#
# The version lives in ONE place: flashpod/__init__.py (pyproject reads it
# dynamically). Each build job refuses a tag that doesn't match it — v0.3.1
# shipped self-reporting 0.3.0 because two version strings were bumped
# independently.
#
# macOS here means MODERN macOS: a universal2 binary (Intel + Apple Silicon)
# built on macos-latest with python.org's fat Python, both slices smoke-tested
# (arm64 natively, x86_64 under Rosetta). The OS X 10.8 build — the
# FireWire-era target — cannot be produced by any GitHub runner and is built
# by hand on 10.8 hardware and uploaded afterwards; see BUILD.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Run JavaScript actions on Node 24. checkout/setup-python are bumped to their
# Node-24 majors below; this also covers the artifact + release actions, whose
# current majors still ship a Node-20 entry point, so no deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = runs on more Linux systems
            slug: linux-x86_64
            bin: flashpod
            archive: flashpod-linux-x86_64.tar.gz
          - os: windows-latest
            slug: windows-x86_64
            bin: flashpod.exe
            archive: flashpod-windows-x86_64.zip
          - os: macos-latest        # for MODERN Macs, Intel AND Apple Silicon
            slug: macos-universal2  # (universal2 fat binary) — the 10.8 build
            bin: flashpod           # stays manual (BUILD.md); this one exists
            archive: flashpod-macos-universal2.tar.gz   # so modern-Mac users
            target_arch: universal2                     # stop grabbing it
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag must match flashpod.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          code="v$(python -c 'import flashpod; print(flashpod.__version__)')"
          if [ "$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but flashpod.__version__ says $code — bump flashpod/__init__.py and re-tag"
            exit 1
          fi

      # A universal2 binary needs a universal2 build Python; setup-python's
      # macOS build is arm64-only. Install python.org's fat build and work in
      # a venv made from it (the venv wins the PATH for all later steps).
      - name: Install universal2 Python (macOS only)
        if: runner.os == 'macOS'
        run: |
          curl -sSLo /tmp/python.pkg \
            https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 \
            -m venv "$RUNNER_TEMP/u2env"
          echo "$RUNNER_TEMP/u2env/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen

      - name: Python 3.6 compatibility check (macOS 10.8 build target)
        shell: bash
        run: sh scripts/check-py36-compat.sh

      - name: Build the binary
        env:
          FLASHPOD_TARGET_ARCH: ${{ matrix.target_arch || '' }}
        run: pyinstaller --clean --noconfirm flashpod.spec

      - name: Verify both architectures (macOS only)
        if: runner.os == 'macOS'
        run: |
          archs="$(lipo -archs dist/flashpod)"
          echo "slices: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::binary is not universal2 (got: $archs)"; exit 1 ;;
          esac

      - name: Smoke test (self-test + firmware download)
        shell: bash
        run: |
          BIN="dist/${{ matrix.bin }}"
          "./$BIN" flash --self-test
          python -c "open('dummy.img','wb').truncate(64*1024*1024)"
          "./$BIN" flash dummy.img --dry-run --yes

      # The runner is arm64, so the smoke test above exercised the arm64
      # slice; Rosetta lets us genuinely run the Intel slice too.
      - name: Smoke test the Intel slice under Rosetta (macOS only)
        if: runner.os == 'macOS'
        run: arch -x86_64 dist/flashpod flash --self-test

      - name: Package archive
        shell: bash
        run: |
          stage="flashpod-${{ matrix.slug }}"
          mkdir -p "$stage"
          cp "dist/${{ matrix.bin }}" "$stage/${{ matrix.bin }}"
          cp LICENSE "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp packaging/windows/README.txt "$stage/"
            7z a -tzip "${{ matrix.archive }}" "$stage" >/dev/null
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp packaging/macos-universal2/README.txt "$stage/"
            chmod +x "$stage/${{ matrix.bin }}"
            tar czf "${{ matrix.archive }}" "$stage"
          else
            cp packaging/linux/install.sh "$stage/" && chmod +x "$stage/install.sh"
            cp packaging/linux/README.txt "$stage/"
            chmod +x "$stage/${{ matrix.bin }}"
            tar czf "${{ matrix.archive }}" "$stage"
          fi
          ls -l "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  pypi:
    name: publish to PyPI
    needs: build              # only after the binaries build & smoke-test clean
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # tag pushes only, never dispatch
    environment: pypi         # MUST match the environment on the PyPI publisher
    permissions:
      contents: read
      id-token: write         # OIDC token for PyPI Trusted Publishing (no secrets)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
