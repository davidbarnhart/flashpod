name: release

# On a `v*` tag this builds the standalone binaries (attached to a GitHub
# Release) AND publishes the pure-Python package to PyPI via Trusted Publishing.
# Tag a release (e.g. `git tag v0.1.6 && git push --tags`) to ship both, or run
# manually from the Actions tab to produce downloadable binaries for testing
# (the PyPI publish is tag-only).
#
# The version lives in ONE place: flashpod/__init__.py (pyproject reads it
# dynamically). Each build job refuses a tag that doesn't match it — v0.3.1
# shipped self-reporting 0.3.0 because two version strings were bumped
# independently.
#
# macOS here means MODERN macOS: a universal2 binary (Intel + Apple Silicon)
# built on macos-latest with python.org's fat Python, both slices smoke-tested
# (arm64 natively, x86_64 under Rosetta). The OS X 10.8 build — the
# FireWire-era target — cannot be produced by any GitHub runner and is built
# by hand on 10.8 hardware and uploaded afterwards; see BUILD.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Run JavaScript actions on Node 24. checkout/setup-python are bumped to their
# Node-24 majors below; this also covers the artifact + release actions, whose
# current majors still ship a Node-20 entry point, so no deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Build + prove the binaries. Shared with test.yml, which calls the same
  # workflow on every push -- so what ships is built and exercised by exactly
  # the same steps as what is tested continuously. package: true adds the
  # archive staging and the artifact upload the jobs below consume.
  build:
    uses: ./.github/workflows/binary.yml
    with:
      package: true

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  pypi:
    name: publish to PyPI
    needs: build              # only after the binaries build & smoke-test clean
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # tag pushes only, never dispatch
    environment: pypi         # MUST match the environment on the PyPI publisher
    permissions:
      contents: read
      id-token: write         # OIDC token for PyPI Trusted Publishing (no secrets)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
