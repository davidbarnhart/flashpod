name: test

# Runs on every push and pull request — unlike release.yml, which only fires on
# a `v*` tag or a manual dispatch and therefore cannot catch a regression until
# release time.
#
# macOS is covered HERE even though release.yml deliberately does not build a
# macOS binary (the ship target is OS X 10.8, which no runner supports). The
# distinction matters: we cannot BUILD for 10.8 in CI, but we can and must
# EXERCISE the macOS backend, which drives `diskutil` through its command line.
# A `-plist` argument-order bug shipped precisely because no runner ever ran
# that code — see scripts/test_macos_platform.py.

on:
  push:
    branches: ["**"]          # tags are release.yml's job, not this one
  pull_request:
  workflow_dispatch:

# A new push to the same ref obsoletes the previous run — cancel it. Rapid
# push trains otherwise stack up full-matrix runs nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The SHIPPED ARTIFACT, built and flashed for real on all three OSes, on
  # every push. Same workflow release.yml calls, so a regression in the frozen
  # build surfaces here instead of after a tag.
  #
  # `source` below runs the SAME full simulated-card flash -- this is not a
  # cheap check versus a thorough one. The difference is only what gets
  # driven: `python -m flashpod` there, dist/flashpod here. Both are needed,
  # because they can disagree: v0.3.1's macOS binary passed the entire source
  # suite and still could not download firmware, the frozen build having
  # carried the build machine's CA paths.
  binary:
    name: binary
    uses: ./.github/workflows/binary.yml
    # Independent of `source` below -- no `needs:`. Both run the same full
    # simulated-card flash; the only difference is what they drive. This one
    # drives the frozen artifact, `source` drives the source tree, and neither
    # consumes the other's output, so they run in parallel and finish in
    # whatever order their own work takes.
    #
    # Plain pushes build Linux only (the cheap, fast signal); the full
    # three-OS matrix runs on pull requests, manual dispatch, and release
    # tags (release.yml always builds everything).
    with:
      slim: ${{ github.event_name == 'push' }}

  compat:
    name: py36 compatibility
    runs-on: ubuntu-latest     # source-only grep; one run covers every platform
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/check-py36-compat.sh

  source:
    name: source (${{ matrix.os }})
    # Plain pushes run Linux only; PRs, dispatch, and tags get the full
    # matrix (macOS coverage matters -- the diskutil backend runs against
    # the real tool -- but it doesn't need to run on every push).
    # macos-latest is arm64, the only macOS runner we can actually get:
    # macos-13 (the last Intel runner) was tried and dropped -- the job sat
    # queued for 7+ hours without ever being allocated, which blocks the
    # whole run from completing. It was only ever extra confirmation; the
    # macOS coverage that matters is the diskutil backend, and macos-latest
    # exercises that. Revisit only if Intel capacity returns.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen

      # ConPTY driver for the simulated-card test: flashpod's prompts are
      # gated on isatty, and on Windows only a pseudoconsole makes that true.
      - name: Install pywinpty (Windows only)
        if: runner.os == 'Windows'
        run: pip install pywinpty

      - name: Self-test (layout + checksum maths, no device)
        shell: bash
        run: python -m flashpod flash --self-test

      - name: Dry-run against an image (exercises the firmware download)
        shell: bash
        run: |
          python -c "open('dummy.img','wb').truncate(64*1024*1024)"
          python -m flashpod flash dummy.img --dry-run --yes

      - name: Multi-iPod detection logic
        shell: bash
        run: PYTHONPATH=. python scripts/test_multi_ipod_detect.py

      - name: Linux disk-candidate enumeration logic
        shell: bash
        run: PYTHONPATH=. python scripts/test_linux_fat_candidates.py

      # The raw driver must open the device PATH on Linux (that's where
      # O_DIRECT lives); PR #54 silently swapped in a buffered fileobj and
      # no test noticed. The simulated-card run exercises the real O_DIRECT
      # I/O; this pins the wiring cheaply on every platform.
      - name: Raw-open wiring (O_DIRECT on Linux)
        shell: bash
        run: PYTHONPATH=. python scripts/test_raw_open_wiring.py

      - name: FireWire queue pinned before mounting
        shell: bash
        run: PYTHONPATH=. python scripts/test_firewire_pin_order.py

      - name: Eject elevates via sudo, not a polkit dialog
        shell: bash
        run: PYTHONPATH=. python scripts/test_eject_elevation.py

      - name: Firmware is resolved before sudo elevation
        shell: bash
        run: PYTHONPATH=. python scripts/test_flash_preelevation.py

      # A frozen build carries no CA certificates and its ssl module has the
      # BUILD machine's cert path compiled in, so firmware downloads died with
      # CERTIFICATE_VERIFY_FAILED on every other Mac. CI never saw it: the
      # runners' own cert paths are always valid.
      - name: HTTPS still verifies when ssl's CA path is missing
        shell: bash
        run: PYTHONPATH=. python scripts/test_ca_bundle_fallback.py

      - name: Post-flash init offer (partition naming per platform)
        shell: bash
        run: PYTHONPATH=. python scripts/test_post_flash_init_offer.py

      # flashpod.card, the library API the emulator's web app calls: every
      # operation on synthetic image files, checked against the CLI where
      # both do the same thing. Linux: it uses fcntl.flock, and the tagged
      # MP3s come from ffmpeg.
      - name: Library API on image files (flashpod.card)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          PYTHONPATH=. python scripts/test_card.py

      - name: A broken iTunesDB is refused, not read as empty
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_itunesdb_strict.py

      - name: Re-adding after a rebuild doesn't copy untagged songs again
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_rebuild_dedup.py

      - name: One place for the logic (the CLI runs flashpod.card)
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_one_place.py

      - name: The catalog names firmware by Apple's version
        shell: bash
        run: PYTHONPATH=. python scripts/test_firmware_versions.py

      - name: flash --no-format says what it does and keeps the music
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_flash_no_format.py

      - name: flash --arm arms only when asked, and only a known disk-mode program
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_flash_arm.py

      - name: add lifts the database ceiling on firmware with the library-leak fix
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_library_fix_detect.py

      - name: a track's type marker and time added survive a load and save
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_itunesdb_roundtrip.py

      - name: .aac files add, WAV/AIFF keep their tags, rebuild skips a bad file
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_tag_fixes.py

      - name: Rust port (rust/flashpod-core) builds, tests, builds for wasm, matches Python
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          (cd rust && cargo test -q && cargo build -q --lib --release --target wasm32-unknown-unknown)
          PYTHONPATH=. python scripts/rust_parity.py

      - name: flashpod burn checks (a file stands in for the card)
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHONPATH=. python scripts/test_burn.py

      - name: macOS backend against live diskutil
        if: runner.os == 'macOS'
        shell: bash
        run: PYTHONPATH=. python scripts/test_macos_platform.py

      # The only step that flashes for real: a backing file attached as an
      # actual block device (losetup on Linux, hdiutil on macOS, a diskpart
      # VHD on Windows), partitioned, formatted, inited and loaded with
      # generated audio, then verified back out of the backing file. This is
      # the coverage unit tests cannot reach -- the post-flash init offer
      # broke twice without a single test failing.
      #
      # Elevation is required (flashpod refuses non-dry-run writes without
      # it). On Linux/macOS that means sudo, passwordless on hosted runners;
      # sudo resets PATH, so the interpreter setup-python installed has to be
      # named explicitly. Windows runners already execute as Administrator,
      # so no wrapper is needed there.
      - name: End-to-end flash against a simulated card
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/simulate_card.py --size-gb 2
          else
            sudo "$(which python)" scripts/simulate_card.py --size-gb 2
          fi

  # The Rust flashpod CLI (rust/flashpod-cli) is a byte-for-byte clone of
  # the Python one; it doesn't ship yet. These run both on the same
  # synthetic cards and inputs and compare exit codes, output and the bytes
  # written, so a Python change that the Rust build doesn't follow fails
  # here. Python 3.14: the Rust argument parser clones 3.14's argparse
  # wording. The fake host's root mode (loop devices, setuid stubs) and the
  # mutant runs stay manual. rust_parity.py (the shared library) already
  # runs in `source` above.
  rust-cli:
    name: Rust CLI matches Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the Rust CLI
        run: cd rust && cargo build --release -p flashpod-cli

      - name: Arguments, help and usage errors (732 runs)
        run: python scripts/test_cli_args.py --rust rust/target/release/flashpod --layout-1

      # `terminal` is left out: its expectations are written against the
      # 2686d4a baseline, not this tree.
      - name: Every command on card images, the picker key by key
        run: |
          python scripts/test_cli_unchanged.py --baseline . --rust rust/target/release/flashpod --layout-1 \
            --only lifecycle rejections limits terminal_dblimit terminal_space terminal_keys \
                   terminal_lines terminal_rebuild terminal_flash flash_catalog wrong_confirm \
                   mount mount_terminal_db mount_terminal_space mount_terminal_big picker

      # Ubuntu 24.04 confines unprivileged user namespaces through AppArmor;
      # the fake host is one (unshare -rm, a private mount namespace).
      - name: Device paths on a fake Linux host (user mode)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python scripts/test_cli_fakehost.py --mode user --rust rust/target/release/flashpod --layout-1

      # The 1.0 commands with no 0.x counterpart (#97), on synthetic cards,
      # each against an expectation computed without the binary.
      - name: The 1.0-only commands (extract, export, playlist, inspect, card new, Mac cards)
        run: |
          sudo apt-get install -yq hfsprogs || true
          PYTHONPATH=. python scripts/test_cli_1_0.py --rust rust/target/release/flashpod

  # The Rust CLI's Platform layer (rust/flashpod-cli/src/platform) driving a
  # real block device: simulate_card.py attaches a backing file (losetup,
  # hdiutil, a diskpart VHD), runs `flash` with the init and music prompts,
  # then ls/add --raw, and verifies the backing file. On macOS and Windows
  # this is the only place those backends run at all; on Linux it is the
  # only automatic run of a real device write (the fake host's root mode
  # stays manual).
  rust-cli-card:
    name: Rust CLI on a simulated card (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install mutagen
          if [ "$RUNNER_OS" = "Windows" ]; then pip install pywinpty; fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build and test the Rust CLI
        run: cd rust && cargo build --release -p flashpod-cli && cargo test -p flashpod-cli

      # Windows runners are already Administrator; elsewhere sudo.
      - name: Flash, init, add and raw ls/add on a simulated card
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/simulate_card.py --size-gb 2 --layout-1 --flashpod rust/target/release/flashpod.exe
          else
            sudo "$(which python)" scripts/simulate_card.py --size-gb 2 --layout-1 --flashpod rust/target/release/flashpod
          fi

  # A Mac card (#104): the Rust library's APM + wrapped HFS+ image, attached
  # and mounted by macOS itself, a file written and read back, fsck_hfs
  # before and after.
  mac-card:
    name: Mac card mounts on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build, attach, mount, write, fsck
        run: scripts/test_mac_card.sh 2000000000
