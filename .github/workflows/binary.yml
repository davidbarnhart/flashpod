name: binary

# Builds a standalone binary per OS and PROVES IT WORKS, then optionally
# packages it for release. Reusable so that exactly one definition of "a
# trustworthy flashpod binary" exists:
#
#   test.yml     calls it on every push  -> build + test, no artifacts
#   release.yml  calls it on a v* tag    -> the same, then package + upload
#
# The point of sharing it is that the binary exercised on every push is built
# by the same steps as the one that ships. Duplicating this into test.yml
# would work until the two copies drifted, and the copy that drifts is the one
# nobody notices -- it would be the released artifact that goes untested.
#
# Build and test live in the SAME job on purpose. A frozen binary only runs on
# the OS that produced it, so splitting them into separate jobs would mean
# uploading a 15 MB artifact and downloading it onto an identical runner for
# no isolation benefit at all.
#
# macOS means MODERN macOS: a universal2 binary (Intel + Apple Silicon) built
# with python.org's fat Python, both slices exercised (arm64 natively, x86_64
# under Rosetta). The OS X 10.8 build -- the FireWire-era target -- cannot be
# produced by any GitHub runner and is built by hand; see BUILD.md.

on:
  workflow_call:
    inputs:
      package:
        description: >-
          Also stage the archive and upload it as an artifact. Off for push
          testing (nobody wants a 15 MB upload per commit); on for releases,
          where the release job downloads what this produced.
        type: boolean
        default: false
      slim:
        description: >-
          Build only the Linux target — the cheap, fast per-push signal.
          Off (the full three-OS matrix) for PRs, dispatch, and releases.
        type: boolean
        default: false

permissions:
  contents: read

# Run JavaScript actions on Node 24, matching the callers.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Rendered as "binary / build + flash (ubuntu-22.04)" and so on. Spelled out
  # because a job called just "build" sitting next to one called "test" reads
  # like a pipeline stage that "test" waits for -- it isn't. These jobs build
  # the artifact AND prove it, in one job, and nothing depends on them.
  build:
    name: build + flash (${{ matrix.os }})
    # The include list lives in JSON because `strategy.matrix` can't see
    # `env` and the slim/full split needs an expression. Targets:
    #   ubuntu-22.04    older glibc = runs on more Linux systems
    #   windows-latest  Windows 10/11 x86-64
    #   macos-latest    MODERN Macs, Intel AND Apple Silicon (universal2 fat
    #                   binary; the 10.8 build stays manual — BUILD.md)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.slim && '[{"os":"ubuntu-22.04","slug":"linux-x86_64","bin":"flashpod","archive":"flashpod-linux-x86_64.tar.gz"}]' || '[{"os":"ubuntu-22.04","slug":"linux-x86_64","bin":"flashpod","archive":"flashpod-linux-x86_64.tar.gz"},{"os":"windows-latest","slug":"windows-x86_64","bin":"flashpod.exe","archive":"flashpod-windows-x86_64.zip"},{"os":"macos-latest","slug":"macos-universal2","bin":"flashpod","archive":"flashpod-macos-universal2.tar.gz","target_arch":"universal2"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only meaningful on a tag; naturally skipped on ordinary pushes.
      - name: Tag must match flashpod.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          code="v$(python -c 'import flashpod; print(flashpod.__version__)')"
          if [ "$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but flashpod.__version__ says $code — bump flashpod/__init__.py and re-tag"
            exit 1
          fi

      # A universal2 binary needs a universal2 build Python; setup-python's
      # macOS build is arm64-only. Install python.org's fat build and work in
      # a venv made from it (the venv wins the PATH for all later steps).
      - name: Install universal2 Python (macOS only)
        if: runner.os == 'macOS'
        run: |
          curl -sSLo /tmp/python.pkg \
            https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 \
            -m venv "$RUNNER_TEMP/u2env"
          echo "$RUNNER_TEMP/u2env/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen

      # ConPTY driver for the simulated-card flash below: flashpod's prompts
      # are gated on isatty, and on Windows only a pseudoconsole makes that
      # true. release.yml never needed this because it only ever got as far as
      # --dry-run, which asks nothing.
      - name: Install pywinpty (Windows only)
        if: runner.os == 'Windows'
        run: pip install pywinpty

      - name: Python 3.6 compatibility check (macOS 10.8 build target)
        shell: bash
        run: sh scripts/check-py36-compat.sh

      - name: Build the binary
        env:
          FLASHPOD_TARGET_ARCH: ${{ matrix.target_arch || '' }}
        run: pyinstaller --clean --noconfirm flashpod.spec

      - name: Verify both architectures (macOS only)
        if: runner.os == 'macOS'
        run: |
          archs="$(lipo -archs dist/flashpod)"
          echo "slices: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::binary is not universal2 (got: $archs)"; exit 1 ;;
          esac

      - name: Smoke test (self-test + firmware download)
        shell: bash
        run: |
          BIN="dist/${{ matrix.bin }}"
          "./$BIN" flash --self-test
          python -c "open('dummy.img','wb').truncate(64*1024*1024)"
          "./$BIN" flash dummy.img --dry-run --yes

      # The runner is arm64, so the smoke test above exercised the arm64
      # slice; Rosetta lets us genuinely run the Intel slice too.
      - name: Smoke test the Intel slice under Rosetta (macOS only)
        if: runner.os == 'macOS'
        run: arch -x86_64 dist/flashpod flash --self-test

      # The smoke tests above never write to a device: --self-test is pure
      # arithmetic and --dry-run stops before the first byte. This is the step
      # that actually flashes -- partition, format, init, load music, then
      # verify the backing file -- against the binary rather than the source.
      #
      # It matters because a frozen build differs from source exactly where it
      # hurts: data files come out of sys._MEIPASS rather than the package
      # directory, imports are resolved by PyInstaller's machinery, and the
      # ssl module carries the BUILD machine's CA paths -- which is how v0.3.1
      # shipped a macOS binary that could not download firmware at all.
      #
      # All three OSes, because all three artifacts are equally frozen.
      # Elevation differs: sudo on Linux/macOS (passwordless on runners, and
      # it resets PATH so the interpreter is named explicitly), while Windows
      # runners already execute as Administrator.
      - name: End-to-end flash with the built binary
        shell: bash
        run: |
          BIN="$PWD/dist/${{ matrix.bin }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/simulate_card.py --size-gb 2 --flashpod "$BIN"
          else
            sudo "$(which python)" scripts/simulate_card.py \
              --size-gb 2 --flashpod "$BIN"
          fi

      # --flashpod is split as a command line, so prefixing `arch -x86_64`
      # flashes the Intel slice for real. Without this the x86_64 half only
      # ever gets --self-test, and Intel Macs are the ones with FireWire.
      - name: End-to-end flash with the Intel slice under Rosetta (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo "$(which python)" scripts/simulate_card.py \
            --size-gb 2 --flashpod "arch -x86_64 $PWD/dist/flashpod"

      - name: Package archive
        if: inputs.package
        shell: bash
        run: |
          stage="flashpod-${{ matrix.slug }}"
          mkdir -p "$stage"
          cp "dist/${{ matrix.bin }}" "$stage/${{ matrix.bin }}"
          cp LICENSE "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp packaging/windows/README.txt "$stage/"
            7z a -tzip "${{ matrix.archive }}" "$stage" >/dev/null
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp packaging/macos-universal2/README.txt "$stage/"
            chmod +x "$stage/${{ matrix.bin }}"
            tar czf "${{ matrix.archive }}" "$stage"
          else
            cp packaging/linux/install.sh "$stage/" && chmod +x "$stage/install.sh"
            cp packaging/linux/README.txt "$stage/"
            chmod +x "$stage/${{ matrix.bin }}"
            tar czf "${{ matrix.archive }}" "$stage"
          fi
          ls -l "${{ matrix.archive }}"

      # GitHub keeps artifacts 90 days by default, which quietly accumulated
      # ~4.4 GB across this account and ran the storage quota out. Two weeks
      # is plenty: these are reproducible build outputs, and anything meant to
      # last is attached to a GitHub Release instead (release assets are
      # stored separately and are not affected by artifact retention).
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 14
          if-no-files-found: error
