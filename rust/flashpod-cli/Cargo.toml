[package]
name = "flashpod-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "the flashpod command line in Rust (M6): same commands, flags and output as the Python flashpod"

[dependencies]
flashpod-core = { path = "../flashpod-core" }
libc = "0.2"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }

# TLS for catalog downloads: rustls on Linux; the system's own TLS (and
# certificate store) on macOS and Windows, which also keeps a C toolchain
# for ring out of those builds.
[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_UI_Shell"] }

[[bin]]
name = "flashpod"
path = "src/main.rs"
