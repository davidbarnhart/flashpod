[package]
name = "flashpod-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "flashpod's card library in Rust: the port of flashpod/card.py (see docs in emupod/docs/FLASHPOD_RUST.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fpcore"
path = "src/bin/fpcore.rs"
